<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#ffffff"/>
  
  <!-- Modern Header -->
  <rect width="400" height="70" fill="linear-gradient(135deg, #667eea 0%, #764ba2 100%)"/>
  <defs>
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="70" fill="url(#headerGradient)"/>
  
  <text x="30" y="35" font-family="Arial, sans-serif" font-size="24" fill="white" font-weight="bold">Craveva</text>
  <text x="30" y="55" font-family="Arial, sans-serif" font-size="12" fill="#e8e8e8">Modern Business Suite</text>
  
  <!-- Profile Circle -->
  <circle cx="350" cy="35" r="20" fill="white" opacity="0.2"/>
  <text x="345" y="40" font-family="Arial, sans-serif" font-size="12" fill="white">👤</text>
  
  <!-- Modern Navigation -->
  <rect y="70" width="400" height="50" fill="#f8f9fa"/>
  <rect x="20" y="80" width="80" height="30" fill="#007bff" rx="15"/>
  <text x="45" y="98" font-family="Arial, sans-serif" font-size="11" fill="white">Dashboard</text>
  
  <text x="120" y="98" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">Projects</text>
  <text x="180" y="98" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">Analytics</text>
  <text x="240" y="98" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">Settings</text>
  
  <!-- Main Content Grid -->
  <rect y="120" width="400" height="160" fill="#f8f9fa"/>
  
  <!-- Card 1 -->
  <rect x="20" y="140" width="110" height="80" fill="white" rx="8" stroke="#e9ecef" stroke-width="1"/>
  <rect x="25" y="145" width="100" height="4" fill="#28a745" rx="2"/>
  <text x="30" y="165" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">Total Revenue</text>
  <text x="30" y="185" font-family="Arial, sans-serif" font-size="18" fill="#212529" font-weight="bold">$24,580</text>
  <text x="30" y="200" font-family="Arial, sans-serif" font-size="9" fill="#28a745">↗ +12.5%</text>
  
  <!-- Card 2 -->
  <rect x="145" y="140" width="110" height="80" fill="white" rx="8" stroke="#e9ecef" stroke-width="1"/>
  <rect x="150" y="145" width="100" height="4" fill="#dc3545" rx="2"/>
  <text x="155" y="165" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">Active Projects</text>
  <text x="155" y="185" font-family="Arial, sans-serif" font-size="18" fill="#212529" font-weight="bold">47</text>
  <text x="155" y="200" font-family="Arial, sans-serif" font-size="9" fill="#dc3545">↘ -2.1%</text>
  
  <!-- Card 3 -->
  <rect x="270" y="140" width="110" height="80" fill="white" rx="8" stroke="#e9ecef" stroke-width="1"/>
  <rect x="275" y="145" width="100" height="4" fill="#ffc107" rx="2"/>
  <text x="280" y="165" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">Team Members</text>
  <text x="280" y="185" font-family="Arial, sans-serif" font-size="18" fill="#212529" font-weight="bold">128</text>
  <text x="280" y="200" font-family="Arial, sans-serif" font-size="9" fill="#ffc107">→ 0%</text>
  
  <!-- Chart Area -->
  <rect x="20" y="235" width="360" height="40" fill="white" rx="8" stroke="#e9ecef" stroke-width="1"/>
  <text x="30" y="250" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">Performance Chart</text>
  
  <!-- Simple Chart Lines -->
  <polyline points="30,265 60,255 90,260 120,250 150,245 180,255 210,240 240,250 270,235 300,245 330,240 360,235" 
            fill="none" stroke="#007bff" stroke-width="2"/>
  <polyline points="30,270 60,265 90,268 120,260 150,255 180,265 210,250 240,260 270,245 300,255 330,250 360,245" 
            fill="none" stroke="#28a745" stroke-width="2" opacity="0.7"/>
  
  <!-- Footer -->
  <rect y="280" width="400" height="20" fill="#6c757d"/>
  <text x="20" y="292" font-family="Arial, sans-serif" font-size="10" fill="white">© 2024 Craveva - Modern Theme</text>
</svg>