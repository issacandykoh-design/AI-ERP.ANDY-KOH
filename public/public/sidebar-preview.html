<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sidebar Icons Preview</title>
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    body { background: #f7f9fc; font-family: system-ui, -apple-system, Segoe UI, Roboto, 'Helvetica Neue', Arial; }
    .sidebar { width: 280px; background: #1f2937; color: #cbd5e1; padding: 16px; border-radius: 12px; }
    .sidebar ul { list-style: none; margin: 0; padding: 0; }
    .accordionItem { margin-bottom: 6px; }
    .nav-item { display: flex; align-items: center; padding: 10px 12px; border-radius: 10px; color: #e5e7eb; text-decoration: none; }
    .nav-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
    .nav-item .sidebar-icon { margin-right: 10px; }
    .title { margin: 18px 0; color: #111827; }
  </style>
</head>
<body>
  <h2 class="title">左侧导航新图标预览</h2>
  <div class="sidebar">
    <ul>
      <li class="accordionItem closeIt">
        <a class="nav-item text-lightest f-15 sidebar-text-color" href="#" title="仪表盘">
          <!-- house -->
          <svg class="sidebar-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 11l9-7 9 7" />
            <path d="M5 10v10h14V10" />
            <path d="M9 14h6v6H9z" />
          </svg>
          <span class="pl-3">仪表盘</span>
        </a>
      </li>
      <li class="accordionItem closeIt">
        <a class="nav-item text-lightest f-15 sidebar-text-color" href="#" title="我的日历">
          <!-- calendar-range -->
          <svg class="sidebar-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" />
            <line x1="8" y1="2" x2="8" y2="6" />
            <line x1="16" y1="2" x2="16" y2="6" />
            <line x1="3" y1="10" x2="21" y2="10" />
            <path d="M7 15h4M13 18h4" />
          </svg>
          <span class="pl-3">我的日历</span>
        </a>
      </li>
      <li class="accordionItem closeIt">
        <a class="nav-item text-lightest f-15 sidebar-text-color" href="#" title="客户与线索">
          <!-- person -->
          <svg class="sidebar-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 20c0-4.418 3.582-6 8-6s8 1.582 8 6" />
          </svg>
          <span class="pl-3">客户与线索</span>
        </a>
      </li>
      <li class="accordionItem closeIt">
        <a class="nav-item text-lightest f-15 sidebar-text-color" href="#" title="工作台">
          <!-- briefcase -->
          <svg class="sidebar-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="7" width="18" height="14" rx="2" />
            <path d="M9 7V5a3 3 0 0 1 6 0v2" />
            <path d="M3 13h18" />
          </svg>
          <span class="pl-3">工作</span>
        </a>
      </li>
      <li class="accordionItem closeIt">
        <a class="nav-item text-lightest f-15 sidebar-text-color" href="#" title="产品">
          <!-- basket -->
          <svg class="sidebar-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 10h16" />
            <path d="M6 10l3-6h6l3 6" />
            <rect x="4" y="10" width="16" height="9" rx="2" />
            <path d="M10 13v3M14 13v3" />
          </svg>
          <span class="pl-3">产品</span>
        </a>
      </li>
      <li class="accordionItem closeIt">
        <a class="nav-item text-lightest f-15 sidebar-text-color" href="#" title="订单">
          <!-- cart3 -->
          <svg class="sidebar-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 6h15l-2 8H8L6 6Z" />
            <circle cx="9" cy="19" r="2" />
            <circle cx="17" cy="19" r="2" />
            <path d="M6 6L5 3H3" />
          </svg>
          <span class="pl-3">订单</span>
        </a>
      </li>
      <li class="accordionItem closeIt">
        <a class="nav-item text-lightest f-15 sidebar-text-color" href="#" title="设置">
          <!-- gear -->
          <svg class="sidebar-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a7.4 7.4 0 0 0 .1-6l-2 .5-1-1.8 1.5-1.4a7.5 7.5 0 0 0-6-2l-.5 2h-2l-.5-2a7.5 7.5 0 0 0-6 2L4 6.7 5 8.5 3.4 9a7.5 7.5 0 0 0 .1 6l2-.5 1 1.8-1.5 1.4a7.5 7.5 0 0 0 6 2l.5-2h2l.5 2a7.5 7.5 0 0 0 6-2L20 17.3 19 15.5l1.4-.5Z" />
          </svg>
          <span class="pl-3">设置</span>
        </a>
      </li>
    </ul>
  </div>
</body>
</html>
